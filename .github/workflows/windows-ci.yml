name: windows-ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore .\JUtilityPalette.sln
      - name: Build
        run: dotnet build .\JUtilityPalette.sln -c Release --no-restore
      - name: Smoke tests
        run: dotnet run --project .\tests\JUtility.SmokeTests\JUtility.SmokeTests.csproj -c Release --no-build
